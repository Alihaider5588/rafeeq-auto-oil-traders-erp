services:
  postgres:
    image: postgres:16-alpine
    container_name: rafeeque_postgres
    restart: always
    environment:
      POSTGRES_USER: rafeeque_user
      POSTGRES_PASSWORD: rafeeque_secure_password_2026
      POSTGRES_DB: rafeeque_oil_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rafeeque_user -d rafeeque_oil_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rafeeque_backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://rafeeque_user:rafeeque_secure_password_2026@postgres:5432/rafeeque_oil_db?schema=public"
      JWT_SECRET: "rafeeque_super_secret_production_jwt_key_2026_rot"
      PORT: 5000
      NODE_ENV: production
      FRONTEND_URL: "http://localhost"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rafeeque_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
